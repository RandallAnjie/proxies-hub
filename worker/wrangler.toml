# Local workerd/wrangler smoke host. RandallFlare builds dist/worker.js from git
# (`npm ci && npm run build`) and does not require this file at deploy time.
name = "proxies-hub"
main = "dist/worker.js"
compatibility_date = "2025-10-01"

[vars]
# Optional. Alias `?token=team` (and Basic username/password `team`) maps here.
# GITHUB_PAT = ""
# Comma-separated hosts or *.wildcards for /v2/r/… ; unset = any public host.
# GENERIC_REGISTRY_ALLOWLIST = ""
# Exact host[:port] allowed over http (workerd tests / LAN registries).
# GENERIC_REGISTRY_HTTP_ORIGINS = ""
